server {
  listen 80;
  root /usr/share/nginx/html;
  add_header Permissions-Policy "microphone=(self), camera=()" always;
  location ~ ^/(api|a2a|\.well-known)/ { proxy_pass http://api:8000; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_read_timeout 3600s; client_max_body_size 26m; }
  location /health { proxy_pass http://api:8000; }
  location / { try_files $uri /index.html; }
}
